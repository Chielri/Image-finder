name: Build Windows Executable

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Poppler binaries for bundling
        run: python scripts/download_poppler_windows.py

      - name: Validate Poppler download
        run: |
          if (Test-Path "backend/poppler/bin/pdftoppm.exe") {
            Write-Host "Poppler download verified: pdftoppm.exe found."
            Write-Host "Contents of backend/poppler/bin/:"
            Get-ChildItem "backend/poppler/bin/" | Format-Table Name, Length
          } else {
            Write-Error "Poppler download failed: backend/poppler/bin/pdftoppm.exe not found!"
            exit 1
          }
        shell: pwsh

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy frontend build into backend
        run: |
          Copy-Item -Recurse frontend/dist backend/frontend_dist
        shell: pwsh

      - name: Build Windows executable with PyInstaller
        run: |
          pyinstaller --noconfirm pyinstaller.spec

      - name: Verify Poppler is bundled
        run: |
          Write-Host "Checking dist/DocumentImageSearch/ structure..."
          if (Test-Path "dist/DocumentImageSearch/") {
            Get-ChildItem "dist/DocumentImageSearch/" -Directory | Format-Table Name
          }
          # PyInstaller 6.x places data files inside _internal/
          $candidates = @(
            "dist/DocumentImageSearch/_internal/poppler/bin/pdftoppm.exe",
            "dist/DocumentImageSearch/poppler/bin/pdftoppm.exe"
          )
          $found = $false
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              $binDir = Split-Path $candidate
              Write-Host "Poppler bundled successfully at: $binDir"
              Get-ChildItem $binDir | Format-Table Name, Length
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Error "Poppler binaries missing from build output!"
            Write-Host "Searching for pdftoppm.exe in dist/..."
            Get-ChildItem "dist/" -Recurse -Filter "pdftoppm.exe" -ErrorAction SilentlyContinue | Format-Table FullName
            exit 1
          }
        shell: pwsh

      - name: Create release archive
        run: |
          cd dist
          Compress-Archive -Path DocumentImageSearch -DestinationPath DocumentImageSearch-windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentImageSearch-windows
          path: dist/DocumentImageSearch-windows.zip
          retention-days: 30

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DocumentImageSearch-windows.zip
